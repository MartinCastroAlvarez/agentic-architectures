name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: ruff check
        run: poetry run ruff check agentic_architectures tests examples
      - name: ruff format --check
        run: poetry run ruff format --check agentic_architectures tests examples
      - name: mypy
        run: poetry run mypy agentic_architectures
      - name: bandit
        run: poetry run bandit -c pyproject.toml -q -r agentic_architectures

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: pip-audit
        run: |
          # pip is tooling, not a shipped dependency: upgrade it so its own advisories don't fail the audit.
          poetry run python -m pip install --upgrade -q pip
          poetry run pip-audit

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run pytest (scripted fake model, no network)
        run: poetry run pytest -q
      - name: Every pattern through the CLI (fake provider)
        run: poetry run python -m agentic_architectures all --provider fake --approve yes --json > all.json && python -c "import json; r = json.load(open('all.json')); assert len(r) == 20 and all(x['answer'] for x in r), r"
      - name: Quickstart example
        run: poetry run python -m examples.quickstart
      - name: Benchmark (simulated latency)
        run: poetry run python -m agentic_architectures.bench
      - name: Build the wheel and check the documents and py.typed are inside
        run: |
          poetry build -q
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for f in ("py.typed", "data/docs/ollama.md", "patterns/react.py"):
              assert any(n.endswith(f) for n in names), f
          print("wheel ok:", len(names), "files")
          PY
